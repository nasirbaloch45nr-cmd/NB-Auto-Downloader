<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #ffffff;
      margin: 0;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    h3 {
      margin: 0;
      color: #00d2ff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .field-group {
      margin-bottom: 10px;
    }
    label {
      font-size: 11px;
      color: #b0b0c3;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 7px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus {
      border-color: #00d2ff;
    }
    select option {
      background: #2a2a40;
      color: #fff;
    }
    .checkbox-group {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 12px;
      color: #d0d0e0;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #fff;
      cursor: pointer;
      margin-bottom: 0;
    }
    button {
      width: 100%;
      padding: 9px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(0, 114, 255, 0.3);
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    .toggle-btn {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      box-shadow: 0 4px 10px rgba(17, 153, 142, 0.3);
    }
    .toggle-btn.active {
      background: linear-gradient(135deg, #cb2d3e, #ef473a);
      box-shadow: 0 4px 10px rgba(239, 71, 58, 0.3);
    }
    .reset-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #b0b0c3;
      font-size: 11px;
      padding: 7px;
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #00d2ff;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.png" alt="Logo">
    <h3>NB Auto Downloader</h3>
  </div>

  <div class="field-group">
    <label for="folderInput">Save Folder (inside Downloads):</label>
    <input type="text" id="folderInput" placeholder="GoogleFlow_Media">
  </div>

  <div class="checkbox-group">
    <label><input type="checkbox" id="dlVideos" checked> Videos (.mp4)</label>
    <label><input type="checkbox" id="dlImages" checked> Images (.webp)</label>
  </div>

  <div class="field-group">
    <label for="intervalSelect">Check Interval:</label>
    <select id="intervalSelect">
      <option value="2000">Every 2 Seconds</option>
      <option value="3000" selected>Every 3 Seconds</option>
      <option value="5000">Every 5 Seconds</option>
      <option value="10000">Every 10 Seconds</option>
    </select>
  </div>

  <button id="downloadBtn">Download Current Page</button>
  <button id="autoToggleBtn" class="toggle-v toggle-btn">Start Auto Monitoring</button>
  <button id="resetBtn" class="reset-btn">Reset History / Clear Log</button>
  
  <div id="status">Status: Ready</div>

  <script src="popup.js"></script>
</body>
</html>
