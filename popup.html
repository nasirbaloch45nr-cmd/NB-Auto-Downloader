<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NB Auto Downloader</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121824;
      color: #ffffff;
      box-sizing: border-box;
    }
    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      box-sizing: border-box;
    }
    .header {
      font-size: 18px;
      font-weight: bold;
      color: #00d2ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .version-badge {
      font-size: 11px;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 4px;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .stats-card {
      background: #0f172a;
      border: 1px solid #00d2ff33;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
    }
    .stat-number {
      font-size: 18px;
      font-weight: bold;
      color: #00d2ff;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #8a99ad;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .card {
      background: #1a2332;
      border: 1px solid #2a3547;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #2a3547;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-primary { background: #00d2ff; color: #000; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #374151; color: #fff; }
    .status {
      font-size: 12px;
      color: #a0aec0;
      text-align: center;
      padding: 6px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #1e293b;
      line-height: 1.4;
    }
    .checkbox-group {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }
    .note {
      font-size: 11px;
      color: #8a99ad;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span>👑 NB Auto Downloader</span>
      <span class="version-badge" id="appVersion">v1.5</span>
    </div>

    <!-- Live Counter Box -->
    <div class="stats-card">
      <div class="stat-box">
        <span class="stat-number" id="counterDownloaded">0</span>
        <span class="stat-label">Clips Downloaded</span>
      </div>
      <div class="stat-box" id="remainingBox" title="Next sequence: 001">
        <span class="stat-number" id="remainingClips">0</span>
        <span class="stat-label">Remaining Clips</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Save Folder & Project</div>
      <input type="text" id="saveFolder" value="GoogleFlow_Media" placeholder="Folder Name">

      <div class="checkbox-group">
        <label><input type="checkbox" id="dlVideos" checked> Videos (.mp4)</label>
        <label><input type="checkbox" id="dlImages" checked> Images (.webp)</label>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Media Controls</div>

      <label style="font-size: 11px; color: #a0aec0;">Download only this aspect ratio:</label>
      <select id="aspectRatioSelect">
        <option value="any" selected>All ratios (no filter)</option>
        <option value="16:9">16:9 (YouTube)</option>
        <option value="9:16">9:16 (TikTok / Shorts)</option>
        <option value="1:1">1:1 (Square)</option>
        <option value="4:3">4:3 (Standard)</option>
      </select>

      <div class="note">Quality: Flow ki original file hi download hoti hai (video 720p, image poori size).</div>
    </div>

    <div class="card" style="margin-top: auto;">
      <div class="section-title">Actions</div>
      <button id="downloadBtn" class="btn btn-primary">Download Current Page</button>
      <button id="monitorBtn" class="btn btn-success">Start Auto Monitoring</button>
      <button id="resetProjectBtn" class="btn btn-secondary">⚡ New Project (Reset Counter to 001)</button>
      <button id="clearLogBtn" class="btn btn-danger">Reset History / Clear Log</button>
    </div>

    <div class="status" id="statusText">Status: Ready</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
