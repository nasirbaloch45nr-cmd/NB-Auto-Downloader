<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f8f9fa;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <h3>NB Auto Downloader</h3>
  <button id="downloadBtn">Start Auto Download</button>
  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
